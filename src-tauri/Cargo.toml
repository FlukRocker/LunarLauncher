[package]
name = "lunarlauncher"
version = "2.2.1"
description = "Modded Minecraft Launcher"
authors = ["Cyber Network Group", "Daniel D. Scalzi"]
# MIT, and it stays MIT: this is a derivative of HeliosLauncher, whose notice
# LICENSE.txt retains because the licence requires it. Scalzi is credited as an
# author because he wrote the work this is a port of.
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lunarlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
# Nothing debuggable ships. Symbols are the bulk of what an attacker uses to
# find offsets in a binary they are attacking, and the launcher is diagnosed
# from its log file rather than from a stack trace on a user's machine, so
# there is nothing to lose.
strip = "symbols"
debug = false

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["fs", "process", "io-util", "macros", "rt-multi-thread", "sync", "net", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"

sysinfo = "0.32"
dirs = "5"
trash = "5"
open = "5"
sha1 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"


md-5 = "0.10"
hex = "0.4"
urlencoding = "2"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
discord-rich-presence = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# OS keystore for the token-encryption key. Native backends on macOS and
# Windows need no system libraries; Linux goes through the Secret Service over
# D-Bus, with the pure-Rust crypto backend so the build does not acquire an
# OpenSSL dependency.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Windows install and update, replacing NSIS and tauri-plugin-updater there.
#
# Windows only, deliberately. Velopack supports all three platforms, but every
# install this project has ever tested is Windows, and migrating macOS and
# Linux at the same time would mean changing three packaging pipelines at once
# with no way to verify any of them. The other two keep the Tauri updater until
# this is proven on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
velopack = "1.2"
