name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri's Linux build needs the system webview and its build deps;
      # macOS and Windows ship theirs.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # --lib only: the binary target embeds the frontend via
      # generate_context!, so building it needs dist/ to exist. On a cold CI
      # checkout that has not been produced yet, and a unit test has no reason
      # to require it. Caught by a container build, where the warm local
      # target/ was not there to hide it.
      - name: Test
        # Exercises the real OS keystore, which local runs deliberately skip:
        # every `cargo test` is a new binary identity, so macOS would prompt a
        # developer on every run. CI builds a fresh keychain each time and is
        # never asked, so this is the place that proves the integration works.
        env:
          LUNAR_TEST_REAL_KEYSTORE: "1"
        run: npm run test:rust

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Our own Azure app registration, baked in by build.rs.
          #
          # Not a secret: a client id is public by design — it appears in the
          # authorize URL every user's browser sees. The *secret* is what must
          # never exist for a public client, and none was created.
          #
          # The "Cyber Launcher" registration: personal accounts only,
          # http://localhost as a public client, public client flows enabled.
          #
          # An earlier id was tested and refused with "Invalid app
          # registration", and that was read as proof approval is required.
          # It proved less than it looked: that id belonged to a different
          # registration with none of this configured, so the message equally
          # meant "not set up for this". This is the configured one, so its
          # answer is the one worth trusting.
          LUNAR_AZURE_CLIENT_ID: 5179a67e-bf3b-40ae-9ff2-3fcdd1ffd8bf
          # Required because bundle.createUpdaterArtifacts is on: the bundler
          # finds a public key in tauri.conf.json and refuses to produce an
          # unsigned update artifact next to it. Without the secret this step
          # fails with "a public key has been found, but no private key",
          # which reads like a config error rather than a missing secret.
          #
          # The private key never enters the repository. Anyone holding it can
          # sign an update that every installed launcher will trust and run.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build -- --target ${{ matrix.target }}

      # Windows gets no installer from `tauri build` any more — NSIS is gone.
      # The launcher exe is zipped into the installer crate as its payload and
      # compiled in, producing one self-contained Setup.exe.
      #
      # Only the exe is packed. Tauri's release directory also holds deps/,
      # build/ and every intermediate object; packing the directory would
      # embed hundreds of megabytes of build detritus in the installer.
      - name: Build installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rel = "src-tauri/target/${{ matrix.target }}/release"
          Compress-Archive -Path "$rel/lunarlauncher.exe" -DestinationPath installer/payload.zip -Force
          cargo build --release --manifest-path installer/Cargo.toml
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Copy-Item installer/target/release/LunarLauncherSetup.exe `
                    "dist-installer/Lunar Launcher Setup.exe"

      # Authenticode, which is what stops SmartScreen warning on download. It
      # is unrelated to the updater's minisign key: that proves an update came
      # from us, this proves the *installer* did.
      #
      # Skipped when no certificate is configured rather than failing the
      # build, so an unsigned installer is still produced while the
      # certificate question is open — but it says so, because an unsigned
      # build that looks identical to a signed one is how an unsigned release
      # ships by accident.
      - name: Sign installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_BASE64) {
            Write-Host "::warning::No WINDOWS_CERT_BASE64 secret; the installer is UNSIGNED and will trigger SmartScreen."
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $st.FullName sign /fd SHA256 /f cert.pfx /p $env:CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 "dist-installer/Lunar Launcher Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item cert.pfx

      # Without this the installers are built and then discarded with the
      # runner. Bundle output lands under a per-target directory, so the glob
      # has to include the target.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lunar-launcher-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          # The `.sig` files are not an extra: publishing a release means
          # POSTing the signature alongside the asset, so an artifact carrying
          # only the installer cannot be published at all. They were being
          # built and then discarded with the runner.
          #
          # The updater archives (.nsis.zip, .app.tar.gz) are what the updater
          # actually downloads — the installer itself is for a human.
          path: |
            dist-installer/*
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
