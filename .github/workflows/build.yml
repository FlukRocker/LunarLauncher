name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri's Linux build needs the system webview and its build deps;
      # macOS and Windows ship theirs.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # --lib only: the binary target embeds the frontend via
      # generate_context!, so building it needs dist/ to exist. On a cold CI
      # checkout that has not been produced yet, and a unit test has no reason
      # to require it. Caught by a container build, where the warm local
      # target/ was not there to hide it.
      - name: Test
        # Exercises the real OS keystore, which local runs deliberately skip:
        # every `cargo test` is a new binary identity, so macOS would prompt a
        # developer on every run. CI builds a fresh keychain each time and is
        # never asked, so this is the place that proves the integration works.
        env:
          LUNAR_TEST_REAL_KEYSTORE: "1"
        run: npm run test:rust

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required because bundle.createUpdaterArtifacts is on: the bundler
          # finds a public key in tauri.conf.json and refuses to produce an
          # unsigned update artifact next to it. Without the secret this step
          # fails with "a public key has been found, but no private key",
          # which reads like a config error rather than a missing secret.
          #
          # The private key never enters the repository. Anyone holding it can
          # sign an update that every installed launcher will trust and run.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build -- --target ${{ matrix.target }}

      # Without this the installers are built and then discarded with the
      # runner. Bundle output lands under a per-target directory, so the glob
      # has to include the target.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lunar-launcher-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
